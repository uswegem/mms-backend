# Production-style stack: build images + Nginx edge
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-mms}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-mms}
    restart: unless-stopped

  backend:
    build:
      context: ../Backend
      dockerfile: Dockerfile
    env_file:
      - ../Backend/.env
    depends_on:
      - redis
      - rabbitmq
    restart: unless-stopped

  frontend:
    build:
      context: ../Frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3001/api/v1
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
