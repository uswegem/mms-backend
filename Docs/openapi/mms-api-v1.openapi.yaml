openapi: 3.0.3
info:
  title: Merchant Management System API
  version: 1.0.0
  description: TANQR/TIPS-aligned MMS REST API. Errors use RFC 7807 Problem Details.
servers:
- url: https://api.example.com/api/v1
  description: Production
- url: http://localhost:3000/api/v1
  description: Local
tags:
- name: Authentication
- name: Authorization
- name: Users
- name: Merchants
- name: Onboarding
- name: QR
- name: Alias
- name: Transactions
- name: Settlement
- name: Reconciliation
- name: SchoolFees
- name: Approvals
- name: Notifications
- name: Reporting
- name: Dashboard
- name: Audit
- name: Configuration
- name: Integrations
- name: Webhooks
- name: Health
security:
- BearerAuth: []
paths:
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Login
      x-permission: public
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
  /auth/refresh:
    post:
      tags:
      - Authentication
      summary: Refresh token
      x-permission: public
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security: []
  /auth/logout:
    post:
      tags:
      - Authentication
      summary: Logout
      x-permission: auth:login
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /auth/logout-all:
    post:
      tags:
      - Authentication
      summary: Logout all sessions
      x-permission: auth:session:revoke-all
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /auth/mfa/setup:
    post:
      tags:
      - Authentication
      summary: Setup MFA
      x-permission: auth:mfa:manage
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                  qrUrl:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /auth/mfa/verify:
    post:
      tags:
      - Authentication
      summary: Verify MFA
      x-permission: public
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - mfaCode
              properties:
                email:
                  type: string
                mfaCode:
                  type: string
      security: []
  /auth/password/forgot:
    post:
      tags:
      - Authentication
      summary: Forgot password
      x-permission: public
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Email sent if account exists
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      security: []
  /auth/password/reset:
    post:
      tags:
      - Authentication
      summary: Reset password
      x-permission: public
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - newPassword
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  minLength: 12
      security: []
  /auth/token/client:
    post:
      tags:
      - Authentication
      summary: Client credentials
      x-permission: auth:client:manage
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - clientId
              - clientSecret
              properties:
                clientId:
                  type: string
                clientSecret:
                  type: string
      security: []
  /authz/roles:
    get:
      tags:
      - Authorization
      summary: List roles
      x-permission: authz:role:read
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    post:
      tags:
      - Authorization
      summary: Create role
      x-permission: authz:role:write
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '201':
          description: Success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              - name
              properties:
                code:
                  type: string
                name:
                  type: string
  /authz/roles/{id}:
    put:
      tags:
      - Authorization
      summary: Update role
      x-permission: authz:role:write
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Updated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
  /authz/roles/{id}/permissions:
    put:
      tags:
      - Authorization
      summary: Assign permissions
      x-permission: authz:role:write
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Updated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - permissionCodes
              properties:
                permissionCodes:
                  type: array
                  items:
                    type: string
  /authz/permissions:
    get:
      tags:
      - Authorization
      summary: List permissions
      x-permission: authz:permission:read
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /authz/me/permissions:
    get:
      tags:
      - Authorization
      summary: My permissions
      x-permission: authz:me
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /authz/users/{userId}/effective-permissions:
    get:
      tags:
      - Authorization
      summary: User effective permissions
      x-permission: authz:role:read
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /users:
    get:
      tags:
      - Users
      summary: List users
      x-permission: user:read
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    post:
      tags:
      - Users
      summary: Create user
      x-permission: user:write
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '201':
          description: Success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - fullName
              - roleIds
              properties:
                email:
                  type: string
                fullName:
                  type: string
                roleIds:
                  type: array
                  items:
                    type: string
                    format: uuid
  /users/me:
    get:
      tags:
      - Users
      summary: Current user
      x-permission: user:read
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /users/{id}:
    get:
      tags:
      - Users
      summary: Get user
      x-permission: user:read
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    put:
      tags:
      - Users
      summary: Update user
      x-permission: user:write
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Updated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                phone:
                  type: string
  /users/{id}/deactivate:
    post:
      tags:
      - Users
      summary: Deactivate user
      x-permission: user:deactivate
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /users/invite:
    post:
      tags:
      - Users
      summary: Invite user
      x-permission: user:invite
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '201':
          description: Success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - roleId
              properties:
                email:
                  type: string
                roleId:
                  type: string
                  format: uuid
  /users/{id}/roles:
    put:
      tags:
      - Users
      summary: Assign roles
      x-permission: user:role:assign
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Updated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - roleIds
              properties:
                roleIds:
                  type: array
                  items:
                    type: string
                    format: uuid
  /merchants:
    get:
      tags:
      - Merchants
      summary: List merchants
      x-permission: merchant:read
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Merchant'
                  meta:
                    type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /merchants/{id}:
    get:
      tags:
      - Merchants
      summary: Get merchant
      x-permission: merchant:read
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    put:
      tags:
      - Merchants
      summary: Update merchant
      x-permission: merchant:write
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Updated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tradingName:
                  type: string
                  maxLength: 100
                city:
                  type: string
                  maxLength: 15
                postalCode:
                  type: string
                  pattern: ^[0-9]{5}$
                mcc:
                  type: string
                  pattern: ^[0-9]{4}$
  /merchants/{id}/suspend:
    post:
      tags:
      - Merchants
      summary: Suspend merchant
      x-permission: merchant:suspend
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /merchants/{id}/reactivate:
    post:
      tags:
      - Merchants
      summary: Reactivate merchant
      x-permission: merchant:suspend
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /merchants/{id}/close:
    post:
      tags:
      - Merchants
      summary: Close merchant
      x-permission: merchant:close
